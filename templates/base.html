
<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background-color: #aaa;

            background-image:
                linear-gradient(
                    335deg,
                    #888 23px,
                    transparent 23px
                ),
                linear-gradient(
                    155deg,
                    #999 23px,
                    transparent 23px
                ),
                linear-gradient(
                    335deg,
                    #888 23px,
                    transparent 23px
                ),
                linear-gradient(
                    155deg,
                    #999 23px,
                    transparent 23px
                );

            background-size: 58px 58px;

            background-position:
                0 2px,
                4px 35px,
                29px 31px,
                34px 6px;
        }

        h1,
        h2,
        h3 {
            font-family: "Permanent Marker", cursive;
        }

        h1 {
            font-size: 52px;
            text-shadow:
                3px 3px 0 #444,
                6px 6px 0 #999;
        }

        .page-container {
            width: 85%;
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;

            background-color: rgba(255, 255, 255, 0.94);

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.35);
        }
    </style>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FoundDesk
        {% endblock %}
    </title>
</head>

<body>

    {% block content %}
    {% endblock %}

</body>

</html>
